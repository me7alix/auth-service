services:
  app:
    image: auth_service
    container_name: auth_service
    environment:
      LOG_LEVEL: Debug
      DATABASE_URL: postgres://authuser:secretpassword@postgres:5432/authdb?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 803248482
      PORT: 31415
    ports:
      - "31415:31415"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: auth_postgres
    restart: always
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine3.21
    container_name: auth_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
